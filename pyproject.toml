[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-live-editor"
version = "0.1.0"
description = "Editor live de texto para PGN com visualizacao de tabuleiro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "levenshtein>=0.25.1",
    "pyqt6>=6.7.1",
    "python-chess>=1.999",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.6",
    "hypothesis>=6.100",
]
package = [
    "pyinstaller>=6.10",
]
# OCR de texto para PDF escaneado, com o OCR embutido no Windows 10/11
# (services/text_ocr.py). Fora do Windows os pacotes nao instalam e o
# programa segue sem o botao.
text-ocr = [
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
]
diagram-ocr = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[project.scripts]
pgn-live-editor = "pgn_live_editor.__main__:main"

[tool.setuptools.packages.find]
include = ["pgn_live_editor*"]

[tool.setuptools.package-data]
pgn_live_editor = ["data/*.json", "models/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os orcamentos de desempenho (R-401) levam ~1 min e rodam a parte: `pytest -m slow -s`.
addopts = "-m 'not slow'"
markers = ["slow: orcamento de desempenho (SPEC_V3 §8); roda no job de qualidade do CI"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

# Type-check em modo gradual (SPEC 6.2): `core/` e obrigatorio e esta limpo --
# e onde mora a logica que decide o que vira lance. `ui/` e `services/` ficam
# para depois: a maior parte do que o mypy tem a dizer ali e sobre `QWidget |
# None` do proprio Qt, e nao sobre o programa.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["pgn_live_editor/core"]

[tool.coverage.run]
source = ["pgn_live_editor/core"]

[tool.coverage.report]
# A SPEC pede 80% em `core/`; o corpus e os testes de regressao levam a 93%.
fail_under = 80
show_missing = true

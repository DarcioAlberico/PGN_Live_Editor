[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgn-live-editor"
version = "0.1.0"
description = "Editor live de texto para PGN com visualizacao de tabuleiro"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "levenshtein>=0.25.1",
    "pyqt6>=6.7.1",
    "python-chess>=1.999",
]

[project.scripts]
pgn-live-editor = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

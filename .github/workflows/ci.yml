name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check pgn_live_editor tests

      - name: Formatacao
        run: ruff format --check pgn_live_editor tests

      - name: Tipos (modo gradual, obrigatorio em core/)
        run: mypy

      - name: Testes e cobertura
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          coverage run -m pytest -q
          coverage report

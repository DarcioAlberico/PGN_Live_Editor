name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `--frozen`: o ambiente do CI e o do uv.lock, nao o que o pip resolver
      # no dia (R-011 do docs/ROADMAP_V3.md).
      - name: Instalar dependencias
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check pgn_live_editor tests

      - name: Formatacao
        run: uv run ruff format --check pgn_live_editor tests

      - name: Tipos (modo gradual, obrigatorio em core/)
        run: uv run mypy

      - name: Testes e cobertura
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run coverage run -m pytest -q
          uv run coverage report
